actions:
  apisYmlCreated: true
  apisListed: 15
  openapiDirCreated: true
  specsSaved: 14
  reason: >-
    Fourteen OpenAPI 3.0.1 documents assembled verbatim from AESO's anonymously served
    APIM developer-portal metadata (see findings.openApiHarvestMethod), each carrying an
    x-provenance block. The fifteenth apis[] entry, the ETS public report surface, has no
    specification and is listed as a verified anonymous data surface with documentation
    links only. No consumer-data, Green Button, ESPI, CDR or OpenID Connect artifact was
    found or created, because none exists.
