summary: >-
  AESO publishes no dedicated API changelog or release-notes page. API changes are announced as
  dated posts in the general Market Updates stream at https://www.aeso.ca/market/market-updates,
  mixed in with generator asset notices, maximum-capability changes and market advisories. The
  Azure APIM developer portal at https://developer-apim.aeso.ca/ carries no release-notes page.
  The entries below are the API-affecting Market Updates found on 2026-07-27, captured verbatim
  from their published text. No AESO API change was announced during 2026 as of this capture.
scheme: uri-path
scheme_note: >-
  Version lives in the gateway path segment (…/public/<api>/v1, /v1.1, /v2). Two APIs have shipped a
  second major version: Current Supply Demand (v1 asset detail, v2 summary) and Unit Commitment Data
  (v2 only; v1 retired). No version header, no date-based versioning, no version negotiation.
