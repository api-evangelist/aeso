apis:
- aid: aeso:aeso-pool-price-report-api
  name: AESO Pool Price Report API
  description: >-
    The hourly Alberta Pool Price — the settlement price of the province's
    energy-only wholesale electricity market — served as JSON for any date range
    back to 2000-01-01, up to one year per request. Each settlement hour returns
    the UTC and Mountain Prevailing Time begin timestamps, the pool price in CAD,
    the forecast pool price, and the thirty-day rolling average. Confirmed live on
    2026-07-27: an anonymous GET to the gateway route returned HTTP 401 with
    "Access denied due to missing subscription key" (a nonexistent path on the same
    gateway returns HTTP 404), which confirms the route is real and that the only
    barrier is the free self-serve key.
  humanURL: https://developer-apim.aeso.ca/api-details#api=poolprice-api-v1-1
  baseURL: https://apimgw.aeso.ca/public/poolprice-api/v1.1
  tags:
  - Pool Price
  - Prices
  - Wholesale Power
  - Energy Markets
  - Alberta
  properties:
  - type: OpenAPI
    url: openapi/aeso-poolprice-api-v1-1-openapi.json
