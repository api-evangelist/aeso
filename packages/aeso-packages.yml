summary: >-
  AESO ships NO first-party client libraries in any language, and has no GitHub organization
  (https://api.github.com/orgs/aeso returns 404). The APIM API Gateway Instructions PDF tells
  developers to download the OpenAPI 3 definition from the developer portal and import it into their
  own API tool (Postman is the worked example) — code generation from the spec is the sanctioned path,
  not an SDK. Registry searches on npm, PyPI, RubyGems, CRAN, Packagist and crates.io found no official
  AESO package. What exists is a thin layer of independent community clients, recorded below as
  official: false so the distinction is never lost.
official_sdk_count: 0
official_note: >-
  No package below is published or endorsed by AESO. Do NOT treat this artifact as evidence of an SDK
  program.
